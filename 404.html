<!DOCTYPE html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Stranica nije pronađena | Meni je pomoglo</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px max(24px,env(safe-area-inset-right)) 24px max(24px,env(safe-area-inset-left));background:#F4EEE4;color:#14213D;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;text-align:center}
main{max-width:520px}
.code{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#1F3C8C}
h1{margin:12px 0 0;font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(40px,9vw,64px);line-height:1}
p{margin:16px 0 0;font-size:17px;line-height:1.6;color:#5E6577}
a{display:inline-block;margin-top:28px;background:#1F3C8C;color:#fff;text-decoration:none;border-radius:999px;padding:16px 26px;font-size:16px;font-weight:600}
a:hover{filter:brightness(1.08)}
</style>
</head>
<body>
<main>
  <div class="code">Greška 404</div>
  <h1>Ova stranica ne postoji.</h1>
  <p>Možda je link zastareo ili je adresa pogrešno ukucana. Vrati se na početnu i pronađi svoju rutinu.</p>
  <a id="home" href="/">Nazad na početnu</a>
</main>
<script>
/* GitHub Pages projekat živi na /ime-repozitorijuma/ — link vodi na koren tog projekta */
(function(){var seg=location.pathname.split('/')[1];if(/\.github\.io$/.test(location.hostname)&&seg){document.getElementById('home').href='/'+seg+'/';}})();
</script>
</body>
</html>
